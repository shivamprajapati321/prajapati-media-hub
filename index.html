<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediaHub Phase 28 PWA Mobile App</title>

<link rel="manifest" href="manifest.json">

<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:18px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat{background:#17181f;border:1px solid #333;border-radius:14px;padding:16px}
.stat h3{margin:0 0 8px;color:#aaa;font-size:12px}
.stat h1{margin:0;color:#ff6b00}
button{padding:12px 16px;background:#ff6b00;border:none;border-radius:10px;font-weight:700;color:#111;cursor:pointer}
input,select,textarea{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:13px}
.badge{padding:5px 10px;border-radius:999px;background:#22c55e20;color:#22c55e;font-size:11px;font-weight:700}
.orange{background:#ff6b0020;color:#ff6b00}
</style>
</head>

<body>

<div class="wrap">

<div class="card">
<h1>Phase 28 - Mobile PWA ERP</h1>
<p>Installable mobile app + offline-ready workflow</p>
</div>

<div class="grid" id="stats"></div>

<div class="card">

<h2>Mobile Execution Entry</h2>

<table>

<tr>
<td><input id="team" placeholder="Team Name"></td>
<td><input id="vehicle" placeholder="Vehicle Number"></td>
<td><input id="city" placeholder="City"></td>
</tr>

<tr>
<td>
<select id="status">
<option>Started</option>
<option>Running</option>
<option>Completed</option>
</select>
</td>

<td><input id="gps" placeholder="GPS Coordinates"></td>

<td><button onclick="saveEntry()">Save Offline Entry</button></td>
</tr>

</table>

</div>

<div class="card">
<h2>Offline Sync Queue</h2>
<table id="queueTable"></table>
</div>

<div class="card">
<h2>PWA Features</h2>

<ul>
<li>Installable mobile app</li>
<li>Offline storage</li>
<li>Field-ready UI</li>
<li>GPS workflow</li>
<li>Execution queue</li>
<li>Future camera integration</li>
<li>Push notification ready</li>
</ul>

<br>

<button onclick="installInfo()">Install App Guide</button>

</div>

</div>

<script>

let entries = JSON.parse(localStorage.getItem("mh28_pwa_entries") || "[]");

function save(){
localStorage.setItem("mh28_pwa_entries", JSON.stringify(entries));
}

function saveEntry(){

let item = {
id:"PWA-"+Date.now(),
team:document.getElementById("team").value,
vehicle:document.getElementById("vehicle").value,
city:document.getElementById("city").value,
status:document.getElementById("status").value,
gps:document.getElementById("gps").value,
time:new Date().toLocaleString("en-IN"),
sync:"Pending"
};

entries.unshift(item);

save();

render();

alert("Offline Entry Saved");

}

function render(){

let total = entries.length;

let pending = entries.filter(x=>x.sync==="Pending").length;

let completed = entries.filter(x=>x.status==="Completed").length;

document.getElementById("stats").innerHTML = `
<div class="stat"><h3>Total Offline Entries</h3><h1>${total}</h1></div>
<div class="stat"><h3>Pending Sync</h3><h1>${pending}</h1></div>
<div class="stat"><h3>Completed</h3><h1>${completed}</h1></div>
`;

let html = `
<tr>
<th>Team</th>
<th>Vehicle</th>
<th>Status</th>
<th>Sync</th>
<th>Time</th>
</tr>`;

entries.forEach(e=>{

html += `
<tr>
<td>${e.team}</td>
<td>${e.vehicle}</td>
<td><span class="badge orange">${e.status}</span></td>
<td><span class="badge">${e.sync}</span></td>
<td>${e.time}</td>
</tr>`;

});

document.getElementById("queueTable").innerHTML = html;

}

function installInfo(){

alert(
"Open in Chrome Mobile → Click 3 dots → Add to Home Screen"
);

}

if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}

render();

</script>

</body>
</html>
