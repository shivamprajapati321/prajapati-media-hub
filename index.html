<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediaHub Phase 22 Quotation & Invoice</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:18px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
input,select,textarea{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700;color:#111;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:13px}
.badge{padding:5px 10px;border-radius:999px;background:#22c55e20;color:#22c55e;font-size:11px;font-weight:700}
.orange{background:#ff6b0020;color:#ff6b00}
.preview{background:#0b0b0b;border:1px solid #333;border-radius:12px;padding:16px;white-space:pre-line}
.stat{background:#17181f;border:1px solid #333;border-radius:14px;padding:16px}
.stat h3{margin:0 0 8px;color:#aaa;font-size:12px}
.stat h1{margin:0;color:#ff6b00}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>Phase 22 - Quotation & Invoice ERP</h1>
<p>Quotation creation + GST invoice + payment summary</p>
</div>

<div class="card">

<h2>Create Quotation / Invoice</h2>

<div class="grid">

<div>
<label>Company</label>
<input id="company">
</div>

<div>
<label>Person</label>
<input id="person">
</div>

<div>
<label>Contact</label>
<input id="contact">
</div>

<div>
<label>City</label>
<input id="city">
</div>

<div>
<label>Service</label>
<select id="service">
<option>Auto Rickshaw Hood Branding</option>
<option>Back Panel</option>
<option>Flex Printing</option>
<option>Wall Wrap</option>
<option>No Parking Board</option>
</select>
</div>

<div>
<label>Quantity</label>
<input id="qty" type="number" oninput="calc()">
</div>

<div>
<label>Rate Per PCS</label>
<input id="rate" type="number" oninput="calc()">
</div>

<div>
<label>GST Type</label>
<select id="gstType" onchange="calc()">
<option>GST</option>
<option>Non GST</option>
</select>
</div>

<div>
<label>Advance Payment</label>
<input id="advance" type="number" oninput="calc()">
</div>

<div>
<label>Status</label>
<select id="status">
<option>Quotation</option>
<option>Invoice</option>
<option>Paid</option>
<option>Outstanding</option>
</select>
</div>

</div>

<br>

<button onclick="saveDoc()">Save Document</button>

</div>

<div class="grid">

<div class="stat">
<h3>Base Amount</h3>
<h1 id="base">₹0</h1>
</div>

<div class="stat">
<h3>GST</h3>
<h1 id="gst">₹0</h1>
</div>

<div class="stat">
<h3>Final Amount</h3>
<h1 id="final">₹0</h1>
</div>

<div class="stat">
<h3>Balance</h3>
<h1 id="balance">₹0</h1>
</div>

</div>

<div class="card">
<h2>Saved Documents</h2>
<table id="docTable"></table>
</div>

<div class="card">
<h2>Preview</h2>
<div id="preview" class="preview">No document selected.</div>
</div>

</div>

<script>

let docs = JSON.parse(localStorage.getItem("mh22_docs") || "[]");

function money(x){
return "₹" + Number(x || 0).toLocaleString("en-IN");
}

function calc(){

let qty = Number(document.getElementById("qty").value || 0);
let rate = Number(document.getElementById("rate").value || 0);
let advance = Number(document.getElementById("advance").value || 0);

let base = qty * rate;

let gst = document.getElementById("gstType").value === "GST"
? Math.round(base * 0.18)
: 0;

let final = base + gst;
let balance = final - advance;

document.getElementById("base").innerText = money(base);
document.getElementById("gst").innerText = money(gst);
document.getElementById("final").innerText = money(final);
document.getElementById("balance").innerText = money(balance);

return {base,gst,final,balance};

}

function saveDoc(){

let totals = calc();

let item = {
id:"DOC-"+Date.now(),
company:document.getElementById("company").value,
person:document.getElementById("person").value,
contact:document.getElementById("contact").value,
city:document.getElementById("city").value,
service:document.getElementById("service").value,
qty:Number(document.getElementById("qty").value || 0),
rate:Number(document.getElementById("rate").value || 0),
gstType:document.getElementById("gstType").value,
advance:Number(document.getElementById("advance").value || 0),
status:document.getElementById("status").value,
base:totals.base,
gst:totals.gst,
final:totals.final,
balance:totals.balance,
created:new Date().toLocaleString("en-IN")
};

docs.unshift(item);

localStorage.setItem("mh22_docs", JSON.stringify(docs));

render();

alert("Document Saved");

}

function render(){

let html = `
<tr>
<th>ID</th>
<th>Company</th>
<th>Service</th>
<th>Final</th>
<th>Status</th>
<th>Preview</th>
</tr>`;

docs.forEach(d=>{

html += `
<tr>
<td>${d.id}</td>
<td>${d.company}</td>
<td>${d.service}</td>
<td>${money(d.final)}</td>
<td><span class="badge orange">${d.status}</span></td>
<td><button onclick="previewDoc('${d.id}')">View</button></td>
</tr>`;

});

document.getElementById("docTable").innerHTML = html;

}

function previewDoc(id){

let d = docs.find(x=>x.id===id);

document.getElementById("preview").innerText = `
PRAJAPATI ADVERTISING

Document ID: ${d.id}
Date: ${d.created}

Company: ${d.company}
Person: ${d.person}
Contact: ${d.contact}
City: ${d.city}

Service: ${d.service}

Quantity: ${d.qty}
Rate: ${money(d.rate)}

Base Amount: ${money(d.base)}
GST: ${money(d.gst)}
Final Amount: ${money(d.final)}

Advance: ${money(d.advance)}
Balance: ${money(d.balance)}

Status: ${d.status}

Thank you for choosing Prajapati Advertising.
`;

}

render();

</script>

</body>
</html>
