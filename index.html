
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MediaHub Phase 7</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:#111;padding:20px;border-right:1px solid #333}
.logo{font-size:42px;font-weight:900;margin-bottom:25px}
.logo span{color:#ff6b00}
.menu button{width:100%;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid #333;background:#1a1b22;color:#fff;font-weight:700;cursor:pointer;text-align:left}
.content{padding:24px}
.card{background:#111;border:1px solid #333;border-radius:18px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;background:#090909;color:#fff;border:1px solid #333;margin-top:6px}
textarea{min-height:80px}
.btn{padding:12px 16px;background:#ff6b00;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.btn2{padding:8px 12px;background:#1f2937;border:1px solid #333;color:#fff;border-radius:8px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left}
.badge{padding:5px 10px;border-radius:999px;background:#ff6b0020;color:#ff6b00;font-size:11px;font-weight:900}
</style>
</head>
<body>

<div class="layout">

<div class="sidebar">
<div class="logo">MEDIA<span>HUB</span></div>

<div class="menu">
<button onclick="dashboard()">Dashboard</button>
<button onclick="createOrder()">Create Order</button>
<button onclick="ordersPage()">Orders</button>
<button onclick="designPage()">Design Approval</button>
</div>
</div>

<div class="content" id="content"></div>

</div>

<script>

let orders = JSON.parse(localStorage.getItem("mh_phase7_orders") || "[]");

function saveDB(){
localStorage.setItem("mh_phase7_orders", JSON.stringify(orders));
}

function dashboard(){

let total = 0;

orders.forEach(o=>{
total += Number(o.final || 0);
});

content.innerHTML = `
<div class='card'>
<h1>Phase 7 Dashboard</h1>
<p>Design + Client Approval System</p>
</div>

<div class='grid'>

<div class='card'>
<h3>Total Orders</h3>
<h1>${orders.length}</h1>
</div>

<div class='card'>
<h3>Total Revenue</h3>
<h1>₹${total.toLocaleString("en-IN")}</h1>
</div>

</div>
`;

}

let locations = [];

function createOrder(){

locations = [];

content.innerHTML = `
<div class='card'>

<h1>Create Real Order</h1>

<div class='grid'>

<div>
<label>Company</label>
<input id='company'>
</div>

<div>
<label>Person</label>
<input id='person'>
</div>

<div>
<label>Contact</label>
<input id='contact'>
</div>

<div>
<label>Rate Per PCS</label>
<input type='number' id='rate' oninput='updateTotals()'>
</div>

</div>

<br>

<h2>Multi City Split</h2>

<div class='grid'>

<div>
<label>Location</label>
<input id='city'>
</div>

<div>
<label>Quantity</label>
<input type='number' id='qty'>
</div>

<div>
<label>Design Type</label>
<select id='designType'>
<option>Same Design</option>
<option>Different Design</option>
</select>
</div>

<div>
<label>Design Upload</label>
<input type='file' id='designUpload'>
</div>

</div>

<br>

<button class='btn2' onclick='addLocation()'>Add Location</button>

<br><br>

<div id='locationTable'></div>

<br>

<div class='grid'>

<div class='card'>
<h3>Total Qty</h3>
<h1 id='totalQty'>0</h1>
</div>

<div class='card'>
<h3>Final Amount</h3>
<h1 id='finalAmount'>₹0</h1>
</div>

</div>

<button class='btn' onclick='saveOrder()'>Create Order</button>

</div>
`;

}

function addLocation(){

let city = document.getElementById("city").value;
let qty = Number(document.getElementById("qty").value || 0);
let designType = document.getElementById("designType").value;
let file = document.getElementById("designUpload").files[0];

if(!city || !qty){
alert("Enter location and quantity");
return;
}

locations.push({
city,
qty,
designType,
designFile : file ? file.name : "Not Uploaded"
});

renderLocations();

}

function renderLocations(){

let html = `
<table>
<tr>
<th>City</th>
<th>Qty</th>
<th>Design</th>
<th>File</th>
</tr>
`;

locations.forEach(l=>{

html += `
<tr>
<td>${l.city}</td>
<td>${l.qty}</td>
<td>${l.designType}</td>
<td>${l.designFile}</td>
</tr>
`;

});

html += "</table>";

document.getElementById("locationTable").innerHTML = html;

updateTotals();

}

function updateTotals(){

let qty = 0;

locations.forEach(l=>{
qty += Number(l.qty);
});

let rate = Number(document.getElementById("rate")?.value || 0);

let total = qty * rate;

document.getElementById("totalQty").innerText = qty;
document.getElementById("finalAmount").innerText = "₹" + total.toLocaleString("en-IN");

}

function saveOrder(){

let qty = 0;

locations.forEach(l=>{
qty += Number(l.qty);
});

let rate = Number(document.getElementById("rate").value || 0);

let total = qty * rate;

orders.unshift({
id : "ORD-" + Date.now(),
company : document.getElementById("company").value,
person : document.getElementById("person").value,
contact : document.getElementById("contact").value,
qty : qty,
rate : rate,
final : total,
status : "Pending Design",
clientApproval : "Pending",
locations : locations
});

saveDB();

alert("Order Created");

ordersPage();

}

function ordersPage(){

let rows = "";

orders.forEach(o=>{

rows += `
<tr>
<td>${o.id}</td>
<td>${o.company}</td>
<td>${o.qty}</td>
<td>₹${o.final.toLocaleString("en-IN")}</td>
<td><span class='badge'>${o.status}</span></td>
<td>${o.clientApproval}</td>
</tr>
`;

});

content.innerHTML = `
<div class='card'>

<h1>Orders</h1>

<table>

<tr>
<th>Order</th>
<th>Company</th>
<th>Qty</th>
<th>Amount</th>
<th>Status</th>
<th>Client Approval</th>
</tr>

${rows}

</table>

</div>
`;

}

function designPage(){

let rows = "";

orders.forEach(o=>{

rows += `
<tr>
<td>${o.id}</td>
<td>${o.company}</td>
<td>${o.locations.map(x=>x.city).join(", ")}</td>
<td>${o.locations.map(x=>x.designType).join(", ")}</td>
<td>${o.clientApproval}</td>

<td>
<button class='btn2' onclick="approveClient('${o.id}')">Approve</button>
<button class='btn2' onclick="rejectClient('${o.id}')">Reject</button>
</td>

</tr>
`;

});

content.innerHTML = `
<div class='card'>

<h1>Design + Client Approval</h1>

<table>

<tr>
<th>Order</th>
<th>Company</th>
<th>Locations</th>
<th>Design</th>
<th>Approval</th>
<th>Action</th>
</tr>

${rows}

</table>

</div>
`;

}

function approveClient(id){

orders.forEach(o=>{

if(o.id === id){
o.clientApproval = "Approved";
o.status = "Ready For Printing";
}

});

saveDB();

designPage();

}

function rejectClient(id){

orders.forEach(o=>{

if(o.id === id){
o.clientApproval = "Revision Required";
o.status = "Design Revision";
}

});

saveDB();

designPage();

}

dashboard();

</script>

</body>
</html>
