<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediaHub Phase 29 Multi-City ERP</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:18px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat{background:#17181f;border:1px solid #333;border-radius:14px;padding:16px}
.stat h3{margin:0 0 8px;color:#aaa;font-size:12px}
.stat h1{margin:0;color:#ff6b00}
input,select{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700;color:#111;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:13px}
.badge{padding:5px 10px;border-radius:999px;background:#22c55e20;color:#22c55e;font-size:11px;font-weight:700}
.orange{background:#ff6b0020;color:#ff6b00}
.blue{background:#38bdf820;color:#38bdf8}
</style>
</head>

<body>

<div class="wrap">

<div class="card">
<h1>Phase 29 - Multi City / Franchise ERP</h1>
<p>City manager system + branch analytics + franchise control</p>
</div>

<div class="grid" id="stats"></div>

<div class="card">

<h2>Add City / Branch</h2>

<table>

<tr>
<td><input id="city" placeholder="City"></td>

<td><input id="manager" placeholder="City Manager"></td>

<td><input id="target" type="number" placeholder="Monthly Target"></td>

<td>
<select id="status">
<option>Active</option>
<option>Growing</option>
<option>Critical</option>
</select>
</td>

<td><button onclick="saveCity()">Save Branch</button></td>

</tr>

</table>

</div>

<div class="card">

<h2>Branch Performance</h2>

<table id="branchTable"></table>

</div>

<div class="card">

<h2>Multi-City Summary</h2>

<div id="summary"></div>

</div>

</div>

<script>

let cities = JSON.parse(localStorage.getItem("mh29_cities") || "[]");

function save(){
localStorage.setItem("mh29_cities", JSON.stringify(cities));
}

function money(x){
return "₹" + Number(x || 0).toLocaleString("en-IN");
}

function saveCity(){

let achieved = Math.floor(Math.random() * 1000000);

let item = {
id:"CITY-"+Date.now(),
city:document.getElementById("city").value,
manager:document.getElementById("manager").value,
target:Number(document.getElementById("target").value || 0),
achieved:achieved,
status:document.getElementById("status").value
};

cities.unshift(item);

save();

render();

alert("Branch Added");

}

function render(){

let total = cities.length;

let totalTarget = cities.reduce((a,x)=>a+x.target,0);

let totalAchieved = cities.reduce((a,x)=>a+x.achieved,0);

document.getElementById("stats").innerHTML = `
<div class="stat"><h3>Total Cities</h3><h1>${total}</h1></div>
<div class="stat"><h3>Total Target</h3><h1>${money(totalTarget)}</h1></div>
<div class="stat"><h3>Total Achieved</h3><h1>${money(totalAchieved)}</h1></div>
`;

let html = `
<tr>
<th>City</th>
<th>Manager</th>
<th>Target</th>
<th>Achieved</th>
<th>Status</th>
</tr>`;

cities.forEach(c=>{

let cls = c.status==="Critical"
? "orange"
: c.status==="Growing"
? "blue"
: "";

html += `
<tr>
<td>${c.city}</td>
<td>${c.manager}</td>
<td>${money(c.target)}</td>
<td>${money(c.achieved)}</td>
<td><span class="badge ${cls}">${c.status}</span></td>
</tr>`;

});

document.getElementById("branchTable").innerHTML = html;

document.getElementById("summary").innerHTML = `
<h2>Enterprise Expansion Summary</h2>

<p><b>Total Active Cities:</b> ${total}</p>
<p><b>Total Franchise Target:</b> ${money(totalTarget)}</p>
<p><b>Total Achieved:</b> ${money(totalAchieved)}</p>

<p>
This structure is ready for:
multi-branch ERP, franchise management, city-wise analytics and regional expansion.
</p>
`;

}

render();

</script>

</body>
</html>
