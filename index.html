<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MediaHub Phase 16 CRUD Console</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:20px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:20px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea,select{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
textarea{min-height:140px;font-family:monospace}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;vertical-align:top}
.badge{background:#22c55e20;color:#22c55e;padding:5px 10px;border-radius:999px;font-size:12px}
.orange{background:#ff6b0020;color:#ff6b00}
.red{background:#ef444420;color:#ef4444}
pre{background:#0b0b0b;border:1px solid #333;border-radius:12px;padding:14px;overflow:auto;color:#ddd}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>Phase 16 - Supabase CRUD Console</h1>
<p>Live API Testing Console + Local Fallback + Table Payload Editor</p>
</div>

<div class="card">
<h2>Supabase Connection</h2>

<div class="grid">
<div>
<label>Supabase URL</label>
<input id="url" placeholder="https://xxxx.supabase.co">
</div>

<div>
<label>Anon Public Key</label>
<input id="key" placeholder="Paste anon public key">
</div>

<div>
<label>Table</label>
<select id="table" onchange="loadTemplate()">
<option>orders</option>
<option>users</option>
<option>order_locations</option>
<option>design_tasks</option>
<option>printing_jobs</option>
<option>stitching_entries</option>
<option>dispatch_entries</option>
<option>execution_photos</option>
<option>accounts_entries</option>
</select>
</div>

<div>
<label>Record ID For Update/Delete</label>
<input id="recordId" placeholder="uuid or id">
</div>
</div>

<br>
<button onclick="saveConfig()">Save Config</button>
<button onclick="testSelect()">Test Select</button>
</div>

<div class="card">
<h2>Payload Editor</h2>
<textarea id="payload"></textarea>
<br>
<button onclick="insertRecord()">Insert Record</button>
<button onclick="selectRecords()">Select Records</button>
<button onclick="updateRecord()">Update Record</button>
<button onclick="deleteRecord()">Delete Record</button>
<button onclick="saveLocal()">Save Local Fallback</button>
</div>

<div class="card">
<h2>Result / Logs</h2>
<pre id="log">Ready.</pre>
</div>

<div class="card">
<h2>Local Fallback Records</h2>
<table id="localTable"></table>
</div>

</div>

<script>
let config = JSON.parse(localStorage.getItem("mh_phase16_config") || "{}");
let localRecords = JSON.parse(localStorage.getItem("mh_phase16_local") || "[]");

const templates = {
orders:{order_no:"ORD-1001",company:"Demo Company",person:"Contact Person",contact:"9999999999",media:"Auto Rickshaw Hood Branding",total_qty:100,final_amount:50000,status:"New"},
users:{name:"Admin User",phone:"9922138138",role:"Admin",status:"active"},
order_locations:{order_id:"ORDER_UUID_HERE",location:"Pune",qty:100,design_type:"Same Design",design_file:""},
design_tasks:{order_id:"ORDER_UUID_HERE",designer:"Designer Name",status:"Pending",client_approval:"Pending"},
printing_jobs:{order_id:"ORDER_UUID_HERE",operator:"Operator Name",machine:"Machine 1",total_qty:100,printed_qty:0,ink_used:"",roll_used:"",status:"Pending"},
stitching_entries:{order_id:"ORDER_UUID_HERE",worker:"Worker Name",qty:10,payment_type:"Monthly",amount:0,ot_amount:0},
dispatch_entries:{order_id:"ORDER_UUID_HERE",dispatch_type:"Team Dispatch",team_or_party:"Team A",bundles:2,pcs:100,vendor:"Vendor Name",lr_number:""},
execution_photos:{order_id:"ORDER_UUID_HERE",vehicle_no:"MH12AB1234",gps:"18.5204,73.8567",photo_url:"",ocr_status:"Manual Verify"},
accounts_entries:{order_id:"ORDER_UUID_HERE",type:"Income",amount:50000,mode:"Bank",status:"Paid"}
};

function log(x){
  document.getElementById("log").textContent = typeof x==="string" ? x : JSON.stringify(x,null,2);
}

function loadConfig(){
  document.getElementById("url").value = config.url || "";
  document.getElementById("key").value = config.key || "";
  document.getElementById("table").value = config.table || "orders";
  loadTemplate();
  renderLocal();
}

function saveConfig(){
  config = {
    url:document.getElementById("url").value.trim(),
    key:document.getElementById("key").value.trim(),
    table:document.getElementById("table").value
  };
  localStorage.setItem("mh_phase16_config", JSON.stringify(config));
  log("Config saved locally.");
}

function loadTemplate(){
  const table = document.getElementById("table").value;
  document.getElementById("payload").value = JSON.stringify(templates[table], null, 2);
}

function headers(){
  const key = document.getElementById("key").value.trim();
  return {
    "apikey": key,
    "Authorization": "Bearer " + key,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
  };
}

function baseUrl(){
  const url = document.getElementById("url").value.trim().replace(/\\/$/,"");
  const table = document.getElementById("table").value;
  return url + "/rest/v1/" + table;
}

async function testSelect(){
  await selectRecords();
}

async function insertRecord(){
  try{
    const payload = JSON.parse(document.getElementById("payload").value);
    const res = await fetch(baseUrl(), {method:"POST", headers:headers(), body:JSON.stringify(payload)});
    const data = await res.json();
    log({status:res.status, data});
  }catch(e){log("Insert error: " + e.message);}
}

async function selectRecords(){
  try{
    const res = await fetch(baseUrl()+"?select=*&limit=20", {headers:headers()});
    const data = await res.json();
    log({status:res.status, data});
  }catch(e){log("Select error: " + e.message);}
}

async function updateRecord(){
  try{
    const id = document.getElementById("recordId").value.trim();
    if(!id){log("Please enter Record ID.");return;}
    const payload = JSON.parse(document.getElementById("payload").value);
    const res = await fetch(baseUrl()+"?id=eq."+encodeURIComponent(id), {method:"PATCH", headers:headers(), body:JSON.stringify(payload)});
    const data = await res.json();
    log({status:res.status, data});
  }catch(e){log("Update error: " + e.message);}
}

async function deleteRecord(){
  try{
    const id = document.getElementById("recordId").value.trim();
    if(!id){log("Please enter Record ID.");return;}
    const res = await fetch(baseUrl()+"?id=eq."+encodeURIComponent(id), {method:"DELETE", headers:headers()});
    let data = "";
    try{data = await res.json();}catch(_){}
    log({status:res.status, data});
  }catch(e){log("Delete error: " + e.message);}
}

function saveLocal(){
  try{
    const table = document.getElementById("table").value;
    const payload = JSON.parse(document.getElementById("payload").value);
    localRecords.unshift({table, payload, created_at:new Date().toLocaleString("en-IN")});
    localStorage.setItem("mh_phase16_local", JSON.stringify(localRecords));
    renderLocal();
    log("Saved to local fallback.");
  }catch(e){log("Local save error: " + e.message);}
}

function renderLocal(){
  let html = "<tr><th>Time</th><th>Table</th><th>Payload</th></tr>";
  localRecords.forEach(r=>{
    html += `<tr><td>${r.created_at}</td><td>${r.table}</td><td><pre>${JSON.stringify(r.payload,null,2)}</pre></td></tr>`;
  });
  document.getElementById("localTable").innerHTML = html;
}

loadConfig();
</script>

</body>
</html>
