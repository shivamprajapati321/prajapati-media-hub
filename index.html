<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediaHub Phase 26 AI Reports</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:18px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat{background:#17181f;border:1px solid #333;border-radius:14px;padding:16px}
.stat h3{margin:0 0 8px;color:#aaa;font-size:12px}
.stat h1{margin:0;color:#ff6b00}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:13px}
input,select,textarea{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
textarea{min-height:100px}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700;color:#111;cursor:pointer}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#22c55e20;color:#22c55e}
.orange{background:#ff6b0020;color:#ff6b00}
.reportbox{background:#0b0b0b;border:1px solid #333;border-radius:12px;padding:16px;white-space:pre-line}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>Phase 26 - AI Reporting Engine</h1>
<p>AI summaries + productivity reports + smart insights</p>
</div>

<div class="grid" id="stats"></div>

<div class="card">

<h2>Create AI Report Entry</h2>

<table>
<tr>
<td><input id="department" placeholder="Department"></td>

<td>
<select id="type">
<option>Daily Productivity</option>
<option>Execution Summary</option>
<option>Sales Summary</option>
<option>Accounts Summary</option>
<option>Operations Alert</option>
</select>
</td>

<td><input id="target" type="number" placeholder="Target"></td>
<td><input id="achieved" type="number" placeholder="Achieved"></td>
</tr>

<tr>
<td colspan="3">
<textarea id="notes" placeholder="AI Notes / Summary"></textarea>
</td>

<td>
<button onclick="saveReport()">Generate Report</button>
</td>
</tr>
</table>

</div>

<div class="card">
<h2>Generated AI Reports</h2>
<table id="reportTable"></table>
</div>

<div class="card">
<h2>AI Smart Summary</h2>
<div id="summary" class="reportbox"></div>
</div>

</div>

<script>

let reports = JSON.parse(localStorage.getItem("mh26_reports") || "[]");

function save(){
localStorage.setItem("mh26_reports", JSON.stringify(reports));
}

function saveReport(){

let target = Number(document.getElementById("target").value || 0);
let achieved = Number(document.getElementById("achieved").value || 0);

let efficiency = target ? Math.round((achieved/target)*100) : 0;

let aiStatus = efficiency >= 90
? "Excellent Performance"
: efficiency >= 70
? "Good Performance"
: efficiency >= 40
? "Average Performance"
: "Critical Performance";

let item = {
id:"AIR-"+Date.now(),
department:document.getElementById("department").value,
type:document.getElementById("type").value,
target:target,
achieved:achieved,
efficiency:efficiency,
status:aiStatus,
notes:document.getElementById("notes").value,
time:new Date().toLocaleString("en-IN")
};

reports.unshift(item);

save();

render();

alert("AI Report Generated");

}

function render(){

let total = reports.length;
let excellent = reports.filter(x=>x.status==="Excellent Performance").length;
let critical = reports.filter(x=>x.status==="Critical Performance").length;

document.getElementById("stats").innerHTML = `
<div class="stat"><h3>Total Reports</h3><h1>${total}</h1></div>
<div class="stat"><h3>Excellent</h3><h1>${excellent}</h1></div>
<div class="stat"><h3>Critical</h3><h1>${critical}</h1></div>
`;

let html = `
<tr>
<th>Department</th>
<th>Type</th>
<th>Efficiency</th>
<th>Status</th>
<th>Time</th>
</tr>`;

reports.forEach(r=>{

let cls = r.status === "Critical Performance"
? "orange"
: "";

html += `
<tr>
<td>${r.department}</td>
<td>${r.type}</td>
<td>${r.efficiency}%</td>
<td><span class="badge ${cls}">${r.status}</span></td>
<td>${r.time}</td>
</tr>`;

});

document.getElementById("reportTable").innerHTML = html;

if(reports.length){

let latest = reports[0];

document.getElementById("summary").innerText = `
AI REPORT SUMMARY

Department: ${latest.department}
Report Type: ${latest.type}

Target: ${latest.target}
Achieved: ${latest.achieved}

Efficiency: ${latest.efficiency}%

AI Status:
${latest.status}

AI Notes:
${latest.notes}

AI Recommendation:
${latest.efficiency < 70
? "Increase productivity, improve workflow and monitor execution closely."
: "Department performance is healthy and operational flow is stable."
}

Generated:
${latest.time}
`;

}

}

render();

</script>

</body>
</html>
