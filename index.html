<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediaHub Phase 21 Sales CRM</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:18px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat{background:#17181f;border:1px solid #333;border-radius:14px;padding:16px}
.stat h3{margin:0 0 8px;color:#aaa;font-size:12px}
.stat h1{margin:0;color:#ff6b00}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:13px}
input,select,textarea{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700;color:#111;cursor:pointer}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#22c55e20;color:#22c55e}
.orange{background:#ff6b0020;color:#ff6b00}
.red{background:#ef444420;color:#ef4444}
.blue{background:#38bdf820;color:#38bdf8}
.progress{height:10px;background:#242424;border-radius:999px;overflow:hidden}
.bar{height:100%;background:#ff6b00}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>Phase 21 - Sales CRM + Lead Funnel</h1>
<p>Lead capture + follow-up + quotation + conversion analytics</p>
</div>

<div class="grid" id="stats"></div>

<div class="card">
<h2>Add Lead</h2>

<table>
<tr>
<td><input id="company" placeholder="Company Name"></td>
<td><input id="person" placeholder="Person Name"></td>
<td><input id="phone" placeholder="Phone"></td>
<td>
<select id="source">
<option>Meta Ads</option>
<option>IndiaMART</option>
<option>JustDial</option>
<option>TradeIndia</option>
<option>Manual</option>
</select>
</td>
</tr>

<tr>
<td>
<select id="service">
<option>Auto Rickshaw Hood Branding</option>
<option>Back Panel</option>
<option>Flex Printing</option>
<option>Wall Wrap</option>
<option>No Parking Board</option>
</select>
</td>

<td>
<select id="stage">
<option>New Lead</option>
<option>Follow Up</option>
<option>Quotation Sent</option>
<option>Negotiation</option>
<option>Won</option>
<option>Lost</option>
</select>
</td>

<td><input id="amount" type="number" placeholder="Quotation Amount"></td>

<td><button onclick="saveLead()">Save Lead</button></td>
</tr>
</table>

</div>

<div class="card">
<h2>Lead Funnel</h2>
<table id="leadTable"></table>
</div>

<div class="card">
<h2>Sales Performance</h2>
<div id="summary"></div>
</div>

</div>

<script>

let leads = JSON.parse(localStorage.getItem("mh21_leads") || "[]");

function save(){
localStorage.setItem("mh21_leads", JSON.stringify(leads));
}

function money(x){
return "₹" + Number(x || 0).toLocaleString("en-IN");
}

function badge(stage){

let cls = "";

if(stage === "Won"){
cls = "";
}
else if(stage === "Negotiation"){
cls = "orange";
}
else if(stage === "Lost"){
cls = "red";
}
else{
cls = "blue";
}

return `<span class="badge ${cls}">${stage}</span>`;

}

function saveLead(){

let item = {
id:"LD-"+Date.now(),
company:document.getElementById("company").value,
person:document.getElementById("person").value,
phone:document.getElementById("phone").value,
source:document.getElementById("source").value,
service:document.getElementById("service").value,
stage:document.getElementById("stage").value,
amount:Number(document.getElementById("amount").value || 0),
created:new Date().toLocaleString("en-IN")
};

leads.unshift(item);

save();

render();

alert("Lead Saved");

}

function render(){

let total = leads.length;
let won = leads.filter(x=>x.stage==="Won").length;
let lost = leads.filter(x=>x.stage==="Lost").length;
let follow = leads.filter(x=>x.stage==="Follow Up").length;

let revenue = leads.filter(x=>x.stage==="Won").reduce((a,x)=>a+x.amount,0);

let conversion = total ? Math.round((won/total)*100) : 0;

document.getElementById("stats").innerHTML = `
<div class="stat"><h3>Total Leads</h3><h1>${total}</h1></div>
<div class="stat"><h3>Won Deals</h3><h1>${won}</h1></div>
<div class="stat"><h3>Follow Ups</h3><h1>${follow}</h1></div>
<div class="stat"><h3>Lost Leads</h3><h1>${lost}</h1></div>
<div class="stat"><h3>Sales Revenue</h3><h1>${money(revenue)}</h1></div>
<div class="stat"><h3>Conversion %</h3><h1>${conversion}%</h1></div>
`;

let html = `
<tr>
<th>Company</th>
<th>Person</th>
<th>Source</th>
<th>Service</th>
<th>Stage</th>
<th>Amount</th>
<th>Time</th>
</tr>`;

leads.forEach(l=>{

html += `
<tr>
<td>${l.company}</td>
<td>${l.person}<br>${l.phone}</td>
<td>${l.source}</td>
<td>${l.service}</td>
<td>${badge(l.stage)}</td>
<td>${money(l.amount)}</td>
<td>${l.created}</td>
</tr>`;

});

document.getElementById("leadTable").innerHTML = html;

document.getElementById("summary").innerHTML = `
<h2>Sales Funnel Summary</h2>

<p><b>Total Leads:</b> ${total}</p>
<p><b>Won Deals:</b> ${won}</p>
<p><b>Lost Leads:</b> ${lost}</p>
<p><b>Follow Ups:</b> ${follow}</p>

<div class="progress">
<div class="bar" style="width:${conversion}%"></div>
</div>

<p><b>Conversion Rate:</b> ${conversion}%</p>

<p>
Track all Meta Ads, IndiaMART, JustDial and TradeIndia leads from one place.
</p>
`;

}

render();

</script>

</body>
</html>
