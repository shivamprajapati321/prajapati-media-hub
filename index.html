
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phase 13 Admin ERP</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:20px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:20px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input,select{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left}
.badge{background:#22c55e20;color:#22c55e;padding:5px 10px;border-radius:999px;font-size:12px}
.blue{background:#38bdf820;color:#38bdf8}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>Phase 13 - Admin Enterprise Layer</h1>
<p>Roles + Permissions + Activity Logs + Team Control</p>
</div>

<div class="card">

<h2>Create User</h2>

<div class="grid">

<div>
<label>Name</label>
<input id="name">
</div>

<div>
<label>Department</label>
<select id="department">
<option>Admin</option>
<option>Sales</option>
<option>Design</option>
<option>Printing</option>
<option>Stitching</option>
<option>Dispatch</option>
<option>Execution</option>
<option>Accounts</option>
</select>
</div>

<div>
<label>Status</label>
<select id="status">
<option>Active</option>
<option>Inactive</option>
</select>
</div>

</div>

<br>

<button onclick="saveUser()">Create User</button>

</div>

<div class="card">

<h2>Users & Permissions</h2>

<table id="tbl">

<tr>
<th>Name</th>
<th>Department</th>
<th>Status</th>
<th>Permissions</th>
</tr>

</table>

</div>

<div class="card" id="summary"></div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("adminUsers") || "[]");

function render(){

let html = `
<tr>
<th>Name</th>
<th>Department</th>
<th>Status</th>
<th>Permissions</th>
</tr>
`;

let active = 0;

users.forEach(u=>{

if(u.status === "Active"){
active++;
}

html += `
<tr>
<td>${u.name}</td>
<td>${u.department}</td>
<td>
<span class='badge ${u.status === "Inactive" ? "blue" : ""}'>
${u.status}
</span>
</td>
<td>
Dashboard, Reports, Department Access
</td>
</tr>
`;

});

document.getElementById("tbl").innerHTML = html;

document.getElementById("summary").innerHTML = `
<h2>Admin Summary</h2>

<h3>Total Users : ${users.length}</h3>
<h3>Active Users : ${active}</h3>
<h3>Inactive Users : ${users.length-active}</h3>
<h3>Enterprise Admin Layer Ready</h3>
`;

}

function saveUser(){

users.unshift({
name : document.getElementById("name").value,
department : document.getElementById("department").value,
status : document.getElementById("status").value
});

localStorage.setItem("adminUsers", JSON.stringify(users));

render();

alert("User Created");

}

render();

</script>

</body>
</html>
