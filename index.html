<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediaHub Phase 24 Inventory ERP</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:18px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat{background:#17181f;border:1px solid #333;border-radius:14px;padding:16px}
.stat h3{margin:0 0 8px;color:#aaa;font-size:12px}
.stat h1{margin:0;color:#ff6b00}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:13px}
input,select{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700;color:#111;cursor:pointer}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#22c55e20;color:#22c55e}
.orange{background:#ff6b0020;color:#ff6b00}
.red{background:#ef444420;color:#ef4444}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>Phase 24 - Inventory + Raw Material ERP</h1>
<p>Stock management + inward/outward + low stock alerts</p>
</div>

<div class="grid" id="stats"></div>

<div class="card">

<h2>Add Inventory Item</h2>

<table>
<tr>
<td><input id="item" placeholder="Item Name"></td>

<td>
<select id="category">
<option>Rexin</option>
<option>Ink</option>
<option>Flex Roll</option>
<option>Vinyl</option>
<option>Accessories</option>
</select>
</td>

<td><input id="vendor" placeholder="Vendor"></td>

<td><input id="stock" type="number" placeholder="Current Stock"></td>

<td><button onclick="saveItem()">Save Item</button></td>
</tr>
</table>

</div>

<div class="card">

<h2>Stock Movement</h2>

<table>
<tr>

<td>
<select id="moveItem"></select>
</td>

<td>
<select id="moveType">
<option>Inward</option>
<option>Outward</option>
<option>Consumption</option>
</select>
</td>

<td><input id="qty" type="number" placeholder="Qty"></td>

<td><input id="remarks" placeholder="Remarks"></td>

<td><button onclick="saveMovement()">Save Entry</button></td>

</tr>
</table>

</div>

<div class="card">
<h2>Inventory Stock</h2>
<table id="inventoryTable"></table>
</div>

<div class="card">
<h2>Stock Movement Reports</h2>
<table id="movementTable"></table>
</div>

<div class="card">
<h2>Inventory Summary</h2>
<div id="summary"></div>
</div>

</div>

<script>

let inventory = JSON.parse(localStorage.getItem("mh24_inventory") || "[]");
let movements = JSON.parse(localStorage.getItem("mh24_movements") || "[]");

function save(){
localStorage.setItem("mh24_inventory", JSON.stringify(inventory));
localStorage.setItem("mh24_movements", JSON.stringify(movements));
}

function saveItem(){

let item = {
id:"INV-"+Date.now(),
name:document.getElementById("item").value,
category:document.getElementById("category").value,
vendor:document.getElementById("vendor").value,
stock:Number(document.getElementById("stock").value || 0)
};

inventory.unshift(item);

save();

render();

alert("Inventory Item Saved");

}

function saveMovement(){

let itemId = document.getElementById("moveItem").value;

let inv = inventory.find(x=>x.id===itemId);

if(!inv){
alert("Select item");
return;
}

let type = document.getElementById("moveType").value;
let qty = Number(document.getElementById("qty").value || 0);

if(type === "Inward"){
inv.stock += qty;
}
else{
inv.stock -= qty;
if(inv.stock < 0){
inv.stock = 0;
}
}

movements.unshift({
id:"MOV-"+Date.now(),
item:inv.name,
type:type,
qty:qty,
remarks:document.getElementById("remarks").value,
time:new Date().toLocaleString("en-IN")
});

save();

render();

alert("Stock Movement Saved");

}

function render(){

let totalItems = inventory.length;
let lowStock = inventory.filter(x=>x.stock <= 20).length;
let totalStock = inventory.reduce((a,x)=>a+x.stock,0);

document.getElementById("stats").innerHTML = `
<div class="stat"><h3>Total Items</h3><h1>${totalItems}</h1></div>
<div class="stat"><h3>Total Stock</h3><h1>${totalStock}</h1></div>
<div class="stat"><h3>Low Stock Alerts</h3><h1>${lowStock}</h1></div>
`;

document.getElementById("moveItem").innerHTML = inventory.map(i=>`
<option value="${i.id}">${i.name}</option>
`).join("");

let invHtml = `
<tr>
<th>Item</th>
<th>Category</th>
<th>Vendor</th>
<th>Stock</th>
<th>Status</th>
</tr>`;

inventory.forEach(i=>{

let cls = i.stock <= 20 ? "red" : "";

invHtml += `
<tr>
<td>${i.name}</td>
<td>${i.category}</td>
<td>${i.vendor}</td>
<td>${i.stock}</td>
<td><span class="badge ${cls}">${i.stock <= 20 ? "Low Stock" : "Available"}</span></td>
</tr>`;

});

document.getElementById("inventoryTable").innerHTML = invHtml;

let movHtml = `
<tr>
<th>Item</th>
<th>Type</th>
<th>Qty</th>
<th>Remarks</th>
<th>Time</th>
</tr>`;

movements.forEach(m=>{

let cls = m.type === "Outward" || m.type === "Consumption"
? "orange"
: "";

movHtml += `
<tr>
<td>${m.item}</td>
<td><span class="badge ${cls}">${m.type}</span></td>
<td>${m.qty}</td>
<td>${m.remarks}</td>
<td>${m.time}</td>
</tr>`;

});

document.getElementById("movementTable").innerHTML = movHtml;

document.getElementById("summary").innerHTML = `
<h2>Inventory Summary</h2>

<p><b>Total Inventory Items:</b> ${totalItems}</p>
<p><b>Total Stock Units:</b> ${totalStock}</p>
<p><b>Low Stock Alerts:</b> ${lowStock}</p>

<p>
Inventory engine ready for production stock deduction and purchase tracking.
</p>
`;

}

render();

</script>

</body>
</html>
