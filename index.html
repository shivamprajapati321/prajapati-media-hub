
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phase 11 Execution GPS ERP</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:20px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:20px;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left}
input,select{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.badge{background:#22c55e20;color:#22c55e;padding:5px 10px;border-radius:999px;font-size:12px}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>Phase 11 - Execution GPS ERP</h1>
<p>Execution Tracking + GPS + OCR + Team Monitoring</p>
</div>

<div class="card">

<h2>Create Execution Entry</h2>

<div class="grid">
<div>
<label>Order ID</label>
<input id="orderId">
</div>

<div>
<label>Execution Team</label>
<input id="team">
</div>

<div>
<label>Vehicle Number</label>
<input id="vehicle">
</div>

<div>
<label>GPS Location</label>
<input id="gps">
</div>

<div>
<label>Photo Count</label>
<select id="photos">
<option>1</option>
<option>3</option>
</select>
</div>

<div>
<label>OCR Status</label>
<select id="ocr">
<option>Matched</option>
<option>Manual Verify</option>
</select>
</div>
</div>

<br>

<button onclick="saveExecution()">Save Execution</button>

</div>

<div class="card">

<h2>Execution Reports</h2>

<table id="tbl">

<tr>
<th>Order</th>
<th>Team</th>
<th>Vehicle</th>
<th>GPS</th>
<th>Photos</th>
<th>OCR</th>
<th>Status</th>
</tr>

</table>

</div>

</div>

<script>

let executions = JSON.parse(localStorage.getItem("executions") || "[]");

function render(){

let html = `
<tr>
<th>Order</th>
<th>Team</th>
<th>Vehicle</th>
<th>GPS</th>
<th>Photos</th>
<th>OCR</th>
<th>Status</th>
</tr>
`;

executions.forEach(e=>{

html += `
<tr>
<td>${e.orderId}</td>
<td>${e.team}</td>
<td>${e.vehicle}</td>
<td>${e.gps}</td>
<td>${e.photos}</td>
<td>${e.ocr}</td>
<td><span class='badge'>Completed</span></td>
</tr>
`;

});

document.getElementById("tbl").innerHTML = html;

}

function saveExecution(){

executions.unshift({
orderId : document.getElementById("orderId").value,
team : document.getElementById("team").value,
vehicle : document.getElementById("vehicle").value,
gps : document.getElementById("gps").value,
photos : document.getElementById("photos").value,
ocr : document.getElementById("ocr").value
});

localStorage.setItem("executions", JSON.stringify(executions));

render();

alert("Execution Saved");

}

render();

</script>

</body>
</html>
