<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediaHub Phase 19 Field Panel</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:14px;max-width:900px;margin:auto}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{padding:12px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:10px;width:100%}
button{padding:12px 16px;background:#ff6b00;border:none;border-radius:10px;font-weight:700;color:#111;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:13px}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#22c55e20;color:#22c55e}
.orange{background:#ff6b0020;color:#ff6b00}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:#17181f;border:1px solid #333;border-radius:14px;padding:14px}
.stat h3{margin:0 0 8px;color:#aaa;font-size:11px}
.stat h1{margin:0;color:#ff6b00}
.timeline{border-left:2px solid #333;padding-left:12px}
.event{margin-bottom:14px}
small{color:#999}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>Phase 19 - Mobile Field Execution Panel</h1>
<p>Field team check-in + GPS attendance + route progress</p>
</div>

<div class="statgrid" id="stats"></div>

<div class="card">
<h2>Team Check-In</h2>

<div class="grid">
<div>
<label>Team Name</label>
<input id="team">
</div>

<div>
<label>Campaign</label>
<input id="campaign">
</div>

<div>
<label>City</label>
<input id="city">
</div>

<div>
<label>GPS Location</label>
<input id="gps" placeholder="18.5204,73.8567">
</div>

<div>
<label>Vehicle Number</label>
<input id="vehicle">
</div>

<div>
<label>Status</label>
<select id="status">
<option>Checked In</option>
<option>On Route</option>
<option>Execution Running</option>
<option>Completed</option>
</select>
</div>

<div>
<label>Photo Count</label>
<select id="photos">
<option>1</option>
<option>3</option>
<option>5</option>
</select>
</div>

<div>
<label>OCR</label>
<select id="ocr">
<option>Matched</option>
<option>Manual Verify</option>
</select>
</div>
</div>

<br>

<button onclick="saveEntry()">Save Field Entry</button>

</div>

<div class="card">
<h2>Live Field Entries</h2>
<table id="entryTable"></table>
</div>

<div class="card">
<h2>Activity Timeline</h2>
<div class="timeline" id="timeline"></div>
</div>

</div>

<script>
let entries = JSON.parse(localStorage.getItem("mh19_entries") || "[]");

function save(){
localStorage.setItem("mh19_entries", JSON.stringify(entries));
}

function renderStats(){
let total = entries.length;
let completed = entries.filter(x=>x.status==="Completed").length;
let running = entries.filter(x=>x.status==="Execution Running").length;
let teams = [...new Set(entries.map(x=>x.team))].length;

document.getElementById("stats").innerHTML = `
<div class="stat"><h3>Total Entries</h3><h1>${total}</h1></div>
<div class="stat"><h3>Completed</h3><h1>${completed}</h1></div>
<div class="stat"><h3>Running</h3><h1>${running}</h1></div>
<div class="stat"><h3>Active Teams</h3><h1>${teams}</h1></div>
`;
}

function saveEntry(){
let item = {
id:"FLD-"+Date.now(),
team:document.getElementById("team").value,
campaign:document.getElementById("campaign").value,
city:document.getElementById("city").value,
gps:document.getElementById("gps").value,
vehicle:document.getElementById("vehicle").value,
status:document.getElementById("status").value,
photos:document.getElementById("photos").value,
ocr:document.getElementById("ocr").value,
time:new Date().toLocaleString("en-IN")
};

entries.unshift(item);
save();
render();
alert("Field Entry Saved");
}

function render(){

renderStats();

let html = `
<tr>
<th>Team</th>
<th>Campaign</th>
<th>City</th>
<th>Vehicle</th>
<th>GPS</th>
<th>Status</th>
<th>OCR</th>
<th>Time</th>
</tr>`;

entries.forEach(e=>{
html += `
<tr>
<td>${e.team}</td>
<td>${e.campaign}</td>
<td>${e.city}</td>
<td>${e.vehicle}</td>
<td>${e.gps}</td>
<td><span class="badge orange">${e.status}</span></td>
<td>${e.ocr}</td>
<td>${e.time}</td>
</tr>`;
});

document.getElementById("entryTable").innerHTML = html;

let tl = "";
entries.slice(0,20).forEach(e=>{
tl += `
<div class="event">
<h3>${e.team} - ${e.status}</h3>
<p>${e.campaign} | ${e.city} | Vehicle: ${e.vehicle}</p>
<small>${e.time}</small>
</div>`;
});

document.getElementById("timeline").innerHTML = tl;
}

render();
</script>

</body>
</html>
