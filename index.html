
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phase 10 Dispatch ERP</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:20px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:20px;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left}
input,select{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Phase 10 - Dispatch ERP</h1>
<p>Dispatch + Vendor + Bundle Tracking</p>
</div>

<div class="card">
<h2>Create Dispatch</h2>

<table>
<tr>
<td><input id="orderId" placeholder="Order ID"></td>
<td><input id="team" placeholder="Team / Party"></td>
<td><input id="bundle" placeholder="Bundle Count"></td>
<td><input id="qty" placeholder="Total PCS"></td>
</tr>

<tr>
<td><input id="vendor" placeholder="Transport Vendor"></td>
<td><input id="lr" placeholder="LR Number"></td>
<td>
<select id="type">
<option>Team Dispatch</option>
<option>Direct Party</option>
</select>
</td>
<td><button onclick="addDispatch()">Save Dispatch</button></td>
</tr>
</table>
</div>

<div class="card">
<h2>Dispatch Reports</h2>
<table id="tbl">
<tr>
<th>Order</th>
<th>Dispatch Type</th>
<th>Team/Party</th>
<th>Bundle</th>
<th>PCS</th>
<th>Vendor</th>
<th>LR</th>
<th>Status</th>
</tr>
</table>
</div>
</div>

<script>
let dispatches = JSON.parse(localStorage.getItem("dispatches") || "[]");

function render(){
let html = `
<tr>
<th>Order</th>
<th>Dispatch Type</th>
<th>Team/Party</th>
<th>Bundle</th>
<th>PCS</th>
<th>Vendor</th>
<th>LR</th>
<th>Status</th>
</tr>
`;

dispatches.forEach(d=>{
html += `
<tr>
<td>${d.orderId}</td>
<td>${d.type}</td>
<td>${d.team}</td>
<td>${d.bundle}</td>
<td>${d.qty}</td>
<td>${d.vendor}</td>
<td>${d.lr}</td>
<td>Ready For Execution</td>
</tr>
`;
});

document.getElementById("tbl").innerHTML = html;
}

function addDispatch(){

dispatches.unshift({
orderId : document.getElementById("orderId").value,
team : document.getElementById("team").value,
bundle : document.getElementById("bundle").value,
qty : document.getElementById("qty").value,
vendor : document.getElementById("vendor").value,
lr : document.getElementById("lr").value,
type : document.getElementById("type").value
});

localStorage.setItem("dispatches", JSON.stringify(dispatches));

render();

alert("Dispatch Saved");

}

render();
</script>
</body>
</html>
