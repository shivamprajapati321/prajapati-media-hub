<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediaHub Phase 23 HR ERP</title>
<style>
body{margin:0;background:#050506;color:#fff;font-family:Arial}
.wrap{padding:18px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat{background:#17181f;border:1px solid #333;border-radius:14px;padding:16px}
.stat h3{margin:0 0 8px;color:#aaa;font-size:12px}
.stat h1{margin:0;color:#ff6b00}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:13px}
input,select{padding:10px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;width:100%}
button{padding:10px 14px;background:#ff6b00;border:none;border-radius:8px;font-weight:700;color:#111;cursor:pointer}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#22c55e20;color:#22c55e}
.orange{background:#ff6b0020;color:#ff6b00}
.red{background:#ef444420;color:#ef4444}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>Phase 23 - HR + Attendance ERP</h1>
<p>Employee management + GPS attendance + payroll-ready structure</p>
</div>

<div class="grid" id="stats"></div>

<div class="card">

<h2>Add Employee</h2>

<table>
<tr>
<td><input id="name" placeholder="Employee Name"></td>
<td>
<select id="department">
<option>Sales</option>
<option>Design</option>
<option>Printing</option>
<option>Stitching</option>
<option>Dispatch</option>
<option>Execution</option>
<option>Accounts</option>
<option>Admin</option>
</select>
</td>
<td><input id="salary" type="number" placeholder="Monthly Salary"></td>
<td><button onclick="saveEmployee()">Save Employee</button></td>
</tr>
</table>

</div>

<div class="card">

<h2>Attendance Entry</h2>

<table>
<tr>
<td><input id="empName" placeholder="Employee Name"></td>

<td>
<select id="attendance">
<option>Present</option>
<option>Absent</option>
<option>Leave</option>
<option>Half Day</option>
</select>
</td>

<td><input id="gps" placeholder="GPS Location"></td>

<td>
<select id="shift">
<option>Morning</option>
<option>Evening</option>
<option>Night</option>
</select>
</td>

<td><button onclick="saveAttendance()">Save Attendance</button></td>
</tr>
</table>

</div>

<div class="card">
<h2>Employees</h2>
<table id="employeeTable"></table>
</div>

<div class="card">
<h2>Attendance Reports</h2>
<table id="attendanceTable"></table>
</div>

<div class="card">
<h2>Payroll Summary</h2>
<div id="summary"></div>
</div>

</div>

<script>

let employees = JSON.parse(localStorage.getItem("mh23_employees") || "[]");
let attendance = JSON.parse(localStorage.getItem("mh23_attendance") || "[]");

function save(){
localStorage.setItem("mh23_employees", JSON.stringify(employees));
localStorage.setItem("mh23_attendance", JSON.stringify(attendance));
}

function money(x){
return "₹" + Number(x || 0).toLocaleString("en-IN");
}

function saveEmployee(){

let emp = {
id:"EMP-"+Date.now(),
name:document.getElementById("name").value,
department:document.getElementById("department").value,
salary:Number(document.getElementById("salary").value || 0)
};

employees.unshift(emp);

save();

render();

alert("Employee Saved");

}

function saveAttendance(){

let item = {
id:"ATT-"+Date.now(),
name:document.getElementById("empName").value,
attendance:document.getElementById("attendance").value,
gps:document.getElementById("gps").value,
shift:document.getElementById("shift").value,
time:new Date().toLocaleString("en-IN")
};

attendance.unshift(item);

save();

render();

alert("Attendance Saved");

}

function render(){

let totalEmp = employees.length;
let totalSalary = employees.reduce((a,x)=>a+x.salary,0);

let present = attendance.filter(x=>x.attendance==="Present").length;
let leave = attendance.filter(x=>x.attendance==="Leave").length;
let absent = attendance.filter(x=>x.attendance==="Absent").length;

document.getElementById("stats").innerHTML = `
<div class="stat"><h3>Total Employees</h3><h1>${totalEmp}</h1></div>
<div class="stat"><h3>Present</h3><h1>${present}</h1></div>
<div class="stat"><h3>Leave</h3><h1>${leave}</h1></div>
<div class="stat"><h3>Absent</h3><h1>${absent}</h1></div>
<div class="stat"><h3>Total Payroll</h3><h1>${money(totalSalary)}</h1></div>
`;

let empHtml = `
<tr>
<th>Name</th>
<th>Department</th>
<th>Salary</th>
</tr>`;

employees.forEach(e=>{

empHtml += `
<tr>
<td>${e.name}</td>
<td>${e.department}</td>
<td>${money(e.salary)}</td>
</tr>`;

});

document.getElementById("employeeTable").innerHTML = empHtml;

let attHtml = `
<tr>
<th>Name</th>
<th>Status</th>
<th>Shift</th>
<th>GPS</th>
<th>Time</th>
</tr>`;

attendance.forEach(a=>{

let cls = a.attendance==="Absent" ? "red" : a.attendance==="Leave" ? "orange" : "";

attHtml += `
<tr>
<td>${a.name}</td>
<td><span class="badge ${cls}">${a.attendance}</span></td>
<td>${a.shift}</td>
<td>${a.gps}</td>
<td>${a.time}</td>
</tr>`;

});

document.getElementById("attendanceTable").innerHTML = attHtml;

document.getElementById("summary").innerHTML = `
<h2>HR Summary</h2>

<p><b>Total Employees:</b> ${totalEmp}</p>
<p><b>Total Payroll:</b> ${money(totalSalary)}</p>
<p><b>Present Today:</b> ${present}</p>
<p><b>Leaves:</b> ${leave}</p>
<p><b>Absent:</b> ${absent}</p>

<p>
HR structure ready for salary system, GPS attendance and payroll automation.
</p>
`;

}

render();

</script>

</body>
</html>
